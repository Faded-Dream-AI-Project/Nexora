# Nexora config preview — ILLUSTRATIVE ONLY (not consumed by any command yet).
# Copyright (c) 2026 Faded-Dream-AI-Project. Source-available; see LICENSE.md.
#
# This file pins the intended schema for `nexora train` (phase 1+) using the
# strict parser that already exists (src/core/nx_config.c). It parses cleanly
# today; the subcommands that read it do not exist yet. Sections and keys
# will be enforced per-command with nx_config_allow_keys() when they land.
# Values shown are sized for the reference machine (GTX 1050 Ti 4 GB).

[model]
name = "tiny-dense"
dim = 256            # embedding / residual width
n_layers = 6
n_heads = 8
ff_mult = 4          # mlp hidden = dim * ff_mult
vocab = 32000
max_seq = 512
rope_base = 10000.0

[data]
train = "data/train.nxck"      # .nxck arrives phase 2
tokenizer = "data/bpe.bin"
seq = 512
workers = 2

[optim]
kind = "adamw"       # adamw | sgd
lr = 3e-4
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
weight_decay = 0.1
grad_clip = 1.0
grad_accum = 4
warmup_steps = 100
schedule = "cosine"  # cosine | constant | linear

[hardware]
mode = "auto"        # gpu | cpu | hybrid | auto
dtype = "f32"        # f32 | f16 | bf16 (fp16 on Pascal: benchmark first)
vram_budget = 3000000000
offload = true

[train]
steps = 20000
batch_seqs = 8
seed = 42
log_every = 10
ckpt_every = 1000
out = "runs/tiny"
resume = false
